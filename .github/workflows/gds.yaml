# Lane Y — tt_um_qbrain_holo — TTSKY26c GDS workflow
# Pattern: TinyTapeout reusable workflow
# Shuttle : TTSKY26c (sky130A, ~2026-09)
# Tile    : 1x2
# Author  : Vasilev Dmitrii <admin@t27.ai>
#
# NOTE: @ttsky26c tag is pending publication by TinyTapeout.
# Using @ttsky26b (latest sky130 shuttle tag) as the current TTSKY26c alias.
# Switch to @ttsky26c once the TinyTapeout team publishes the tag.
# R-SI-1: No `*` operator in RTL. CLOCK_PERIOD 20.0 ns (50 MHz NoC).

name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    uses: TinyTapeout/tt-gds-action/.github/workflows/gds.yml@ttsky26b
    secrets: inherit

  precheck:
    needs: gds
    uses: TinyTapeout/tt-gds-action/.github/workflows/precheck.yml@ttsky26b
    secrets: inherit

  gl_test:
    needs: gds
    uses: TinyTapeout/tt-gds-action/.github/workflows/gl_test.yml@ttsky26b
    secrets: inherit

  viewer:
    needs: gds
    uses: TinyTapeout/tt-gds-action/.github/workflows/viewer.yml@ttsky26b
    secrets: inherit
    permissions:
      pages: write
      id-token: write
